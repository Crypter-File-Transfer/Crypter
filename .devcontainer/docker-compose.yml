name: crypter-pipeline

services:
  pipeline:
    container_name: crypter-pipeline
    image: ghcr.io/crypter-file-transfer/crypter-devcontainer:latest
    pull_policy: missing
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    environment:
      CRYPTER_UPSTREAM: Crypter-File-Transfer/Crypter
      CRYPTER_GIT_NAME: ${CRYPTER_GIT_NAME}
      CRYPTER_GIT_EMAIL: ${CRYPTER_GIT_EMAIL}
    volumes:
      - workspace:/work
      - claude:/home/agent/.claude
      # Plans are authored on the host and read from /plans.
      - ../.claude/plans:/plans:ro
    # /work/Crypter does not exist until crypter-clone-upstream has run, so the container starts
    # one level up. Open a shell with `exec -w /work/Crypter`.
    working_dir: /work
    # crypter-clone-upstream leaves an existing workspace alone and only refetches, so running
    # it on every start is safe.
    command: bash -lc "crypter-clone-upstream && sleep infinity"

volumes:
  workspace:
    name: crypter-pipeline-workspace
  claude:
    name: crypter-pipeline-claude
